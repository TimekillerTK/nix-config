creation_rules:
  - path_regex: secrets/default.ya?ml$
    key_groups:
      - age:
          - *mbp
          - *anya
          - *beltanimal
          - *hummingbird
          - *dockerhost
          - *jellyfin
          - *nix-cache
          - *master
  - path_regex: secrets/tk.ya?ml$
    key_groups:
      - age:
          - *mbp
          - *anya
          - *beltanimal
          - *dockerhost
          - *master
  - path_regex: secrets/astra.ya?ml$
    key_groups:
      - age:
          - *mbp
          - *anya
          - *beltanimal
          - *hummingbird
          - *master
  - path_regex: secrets/example.ya?ml$
    key_groups:
      - age:
          - *mbp
          - *anya
          - *beltanimal
          - *example
          - *master
  - path_regex: secrets/router.ya?ml$
    key_groups:
      - age:
          - *mbp
          - *anya
          - *beltanimal
          - *router
          - *master

  # Everyone has access to the builder key, always add hosts here
  - path_regex: secrets/builder_key.ya?ml$
    key_groups:
      - age:
          - *mbp
          - *anya
          - *dockerhost
          - *beltanimal
          - *hummingbird
          - *tailscale
          - *router
          - *jellyfin
          - *example
          - *nix-cache
          - *grafana
          - *master

  # For the nix cache server
  - path_regex: secrets/harmonia_key.ya?ml$
    key_groups:
      - age:
          - *mbp
          - *anya
          - *beltanimal
          - *nix-cache
          - *master

  # Host keys for all the other hosts below (for bootstrapping/installation)
  - path_regex: secrets/host_keys/nix_cache.ya?ml$
    key_groups:
      - age:
          - *master
          - *nix-cache
