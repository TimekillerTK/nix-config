# Mealie - Container (App)
#
# It is applied at instance creation time by the `incus-instances` systemd unit
# (modules/features/incus-instances.nix).
#
# NOTE: The instance is created with `--no-profiles` (see
# `modules/features/incus-instances.nix`), so no profile is applied. Everything
# below is self-contained — there is no `default` profile contribution.

config:
  boot.autorestart: "true"
  boot.autostart: "true"
  environment.ALLOW_SIGNUP: "true"
  environment.BASE_URL: https://cookbook.cyn.internal
  environment.MAX_WORKERS: "1"
  environment.PGID: "100"
  environment.PUID: "1000"
  environment.TOKEN_TIME: "2160"
  environment.TZ: Europe/Amsterdam
  environment.WEB_CONCURRENCY: "1"
  limits.memory: 1000MiB

devices:
  eth0:
    type: nic
    network: incusbr1
  http:
    type: proxy
    listen: tcp:0.0.0.0:8050
    connect: tcp:127.0.0.1:9000
  root:
    type: disk
    path: /
    pool: default
    size: 35GiB

